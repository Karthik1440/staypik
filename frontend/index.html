<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.png?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />

  <meta name="description"
    content="Staypik – Discover premium PG accommodations, co-living spaces, and long-term apartments. Find and book your next nest today." />
  <meta name="keywords" content="PG, co-living, hostels, rental apartments, room booking, Staypik, paying guest, long term rentals" />
  <link rel="canonical" href="https://www.staypik.in/" />

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:site_name" content="Staypik" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.staypik.in/" />
  <meta property="og:title" content="Staypik | Premium PG & Accommodations" />
  <meta property="og:description" content="Discover verified PG accommodations, co-living spaces, and rental hostels with Staypik. Direct owner listings, zero hidden charges." />
  <meta property="og:image" content="https://www.staypik.in/logo512.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://www.staypik.in/" />
  <meta name="twitter:title" content="Staypik | Premium PG & Accommodations" />
  <meta name="twitter:description" content="Discover verified PG accommodations, co-living spaces, and rental hostels with Staypik." />
  <meta name="twitter:image" content="https://www.staypik.in/logo512.png" />

  <!-- Preconnect & DNS Prefetch to eliminate network latency for FCP & LCP -->
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <!-- Preload Critical LCP Hero Image -->
  <link rel="preload" as="image" href="https://images.unsplash.com/photo-1616594039964-ae9021a400a0?auto=format&fit=crop&w=480&q=60&fm=webp" fetchpriority="high" />

  <!-- JSON-LD Structured Data for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://www.staypik.in/#website",
        "url": "https://www.staypik.in/",
        "name": "Staypik",
        "description": "Discover verified PG accommodations, co-living spaces, and long-term rental apartments.",
        "publisher": {
          "@id": "https://www.staypik.in/#organization"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.staypik.in/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "Organization",
        "@id": "https://www.staypik.in/#organization",
        "name": "Staypik",
        "url": "https://www.staypik.in/",
        "logo": "https://www.staypik.in/logo512.png",
        "sameAs": [
          "https://www.instagram.com/staypik",
          "https://www.facebook.com/staypik",
          "https://twitter.com/staypik",
          "https://www.linkedin.com/company/staypik"
        ]
      }
    ]
  }
  </script>

  <title>Staypik | Premium PG & Accommodations</title>
</head>

<body className="bg-slate-50">
  <noscript>Discover amazing rooms and apartments with Staypik.</noscript>
  <div id="root">
    <!-- Initial shell skeleton for instant FCP (< 1s) -->
    <div style="min-height: 100vh; background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
      <header style="height: 64px; background: white; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
        <span style="font-weight: 900; font-size: 20px; color: #b45309;">Stay<span style="color: #1e293b;">pik</span></span>
      </header>
    </div>
  </div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
